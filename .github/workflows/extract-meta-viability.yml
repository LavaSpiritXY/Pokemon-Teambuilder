name: Extract meta viability module

on:
  push:
    branches: [champions-tournament-data]

permissions:
  contents: write

jobs:
  extract:
    if: ${{ !contains(github.event.head_commit.message, 'Meta viability extraction complete') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: champions-tournament-data
          fetch-depth: 0

      - name: Extract meta viability code
        shell: python
        run: |
          from pathlib import Path
          import re

          app = Path('app.py')
          target = Path('champions/meta_viability.py')
          text = app.read_text(encoding='utf-8')

          if target.exists():
              print('meta_viability.py already exists; nothing to do')
              raise SystemExit(0)

          smogon_start = text.index('SMOGON_USAGE_DB = {}')
          viability_start = text.index('def calculate_meta_viability(')
          checks_marker = '# ==========================================\n# 3. META-GATED CHECKS, COUNTERS & SYNERGY'
          checks_start = text.index(checks_marker)
          db_marker = '# -----------------------------------------------------------------------------\n# 0. COMPETITIVE META EVALUATION ENGINE & DATA MODELS'
          db_start = text.index('CHAMPIONS_META_DB = {}')

          smogon_block = text[smogon_start:viability_start]
          viability_block = text[viability_start:checks_start]

          module = '''from champions.meta_utils import detect_archetypes\n\n\n''' + smogon_block + viability_block
          target.write_text(module.rstrip() + '\n', encoding='utf-8')

          import_block = '''from champions.meta_viability import (\n    CHAMPIONS_META_DATA,\n    SMOGON_USAGE_DB,\n    calculate_meta_viability,\n    get_smogon_stats_for,\n)\n'''
          anchor = 'from champions.meta_engine import (\n'
          text = text.replace(anchor, import_block + '\n' + anchor, 1)

          text = text[:smogon_start] + text[checks_start:]
          app.write_text(text, encoding='utf-8')

      - name: Validate syntax
        run: python -m py_compile app.py champions/meta_viability.py

      - name: Validate imports
        run: python -c "from champions.meta_viability import calculate_meta_viability, get_smogon_stats_for; from app import calculate_meta_viability as app_calc; assert calculate_meta_viability is app_calc; print('meta viability extraction validated')"

      - name: Commit extraction and remove automation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py champions/meta_viability.py
          git commit -m "Meta viability extraction complete"
          git push origin HEAD:champions-tournament-data
          rm -f .github/workflows/extract-meta-viability.yml
          git add -u .github/workflows/extract-meta-viability.yml
          if ! git diff --cached --quiet; then
            git commit -m "Remove meta viability extraction automation"
            git push origin HEAD:champions-tournament-data
          fi
