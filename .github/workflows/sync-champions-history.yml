name: Sync Pokémon Champions tournament history

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-champions-history.yml"
      - "tools/migrate_champions_history_schema.py"
      - "tools/enrich_tournament_moves.py"
      - "tests/test_history_schema_migration.py"
      - "tests/test_tournament_data.py"
      - "tests/test_tournament_move_history.py"
      - "champions/tournament_data.py"
      - "champions/tournament_move_history.py"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: champions-history
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Migrate Champions history schema
        run: python tools/migrate_champions_history_schema.py

      - name: Test Champions history schema migration
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest tests/test_history_schema_migration.py -v

      - name: Automatically discover and sync Champions tournaments
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python tools/sync_champions_history.py \
            --discovery-pages 10 \
            --page-size 100 \
            --batch-size 25 \
            --delay 1.5

      - name: Rebuild tournament move history from cached decklists
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python tools/enrich_tournament_moves.py

      - name: Run tournament data regression tests in isolation
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest tests/test_tournament_data.py -v

      - name: Run remaining Champions regression tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest \
            test_champions_auto_sync.py \
            test_champions_history_data.py \
            test_champions_incremental_history.py \
            tests/test_tournament_move_history.py \
            tests/test_meta_analytics.py \
            tests/test_meta_viability.py \
            tests/test_type_chart.py \
            tests/test_champions_end_to_end.py -v

      - name: Validate generated data and compile modules
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m json.tool champions_meta_history.json > /dev/null
          python -m json.tool champions_event_ids.json > /dev/null
          python -m py_compile \
            champions/limitless_data.py \
            champions/historical_ingestion.py \
            champions/incremental_history.py \
            champions/history_data.py \
            champions/regulation.py \
            champions/tournament_data.py \
            champions/tournament_move_history.py \
            champions_meta.py \
            champions_integration.py \
            tools/sync_champions_history.py \
            tools/enrich_tournament_moves.py \
            tools/migrate_champions_history_schema.py

      - name: Commit updated history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add champions_event_ids.json champions_meta_history.json
          if git diff --cached --quiet; then
            echo "No Champions history changes detected."
            exit 0
          fi
          git commit -m "Sync tournament move history"
          git push origin HEAD:main
