name: Sync Pokémon Champions tournament history

on:
  schedule:
    # Run four times per day so new tournaments are picked up without manual work.
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [champions-tournament-data, main]
    paths:
      - "tools/sync_champions_history.py"
      - "champions/historical_ingestion.py"
      - "champions/limitless_data.py"
      - "champions_aggregation_v2.py"

permissions:
  contents: write

concurrency:
  group: champions-history-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    # Avoid recursively triggering this workflow from its own generated commit.
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, 'Automated Champions history sync') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Automatically discover and sync Champions tournaments
        run: |
          python tools/sync_champions_history.py \
            --discovery-pages 10 \
            --page-size 100 \
            --batch-size 25 \
            --delay 1.5

      - name: Validate generated data and compile modules
        run: |
          python -m json.tool champions_meta_history.json > /dev/null
          python -m json.tool champions_event_ids.json > /dev/null
          python -m py_compile \
            champions/limitless_data.py \
            champions/historical_ingestion.py \
            champions/history_data.py \
            champions/tournament_data.py \
            champions_aggregation_v2.py \
            tools/sync_champions_history.py

      - name: Commit updated history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add champions_event_ids.json champions_meta_history.json
          if git diff --cached --quiet; then
            echo "No Champions history changes detected."
            exit 0
          fi
          git commit -m "Automated Champions history sync"
          git push origin "HEAD:${{ github.ref_name }}"
