name: One-time wire Champions item selector

on:
  push:
    branches: [main]
    paths:
      - "tools/wire_champions_item_selector.py"
      - ".github/workflows/one-time-wire-item-selector.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply item-selector migration
        run: python tools/wire_champions_item_selector.py

      - name: Validate migration
        run: python -m pytest tests/test_item_selector_wiring.py tests/test_item_data.py -v

      - name: Commit migration and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git rm .github/workflows/one-time-wire-item-selector.yml
          git commit -m "Wire app to Champions item registry"
          git push origin HEAD:main
