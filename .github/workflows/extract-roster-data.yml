name: Extract roster data

on:
  push:
    branches:
      - champions-tournament-data
    paths:
      - tools/extract_roster_data.py

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run extraction
        run: python tools/extract_roster_data.py

      - name: Verify refactor
        run: |
          python -m py_compile app.py champions/roster_data.py
          python - <<'PY'
          import ast
          from pathlib import Path
          app = ast.parse(Path('app.py').read_text(encoding='utf-8'))
          names = {n.name for n in app.body if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef))}
          forbidden = {
              'fetch_champions_learnsets',
              'fetch_champions_pokedex_entries',
              'display_name_for_species_key',
          }
          assert not (names & forbidden), names & forbidden
          print('Roster extraction source check passed')
          PY

      - name: Commit refactor and remove temporary automation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py champions/roster_data.py
          git rm tools/extract_roster_data.py .github/workflows/extract-roster-data.yml
          git commit -m "Update 28: extract roster data helpers"
          git push
