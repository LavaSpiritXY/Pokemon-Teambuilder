name: Apply base-form Mega selector

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/apply_base_form_mega_selector.py'

permissions:
  contents: write

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Apply migration
        run: python tools/apply_base_form_mega_selector.py

      - name: Validate migration
        run: |
          python -m py_compile app.py champions/roster_data.py champions/team_state.py
          python -m pytest -q tests/test_item_data.py tests/test_item_selector_wiring.py tests/test_team_analyzer.py
          python - <<'PY'
          from pathlib import Path
          app = Path('app.py').read_text(encoding='utf-8')
          roster = Path('champions/roster_data.py').read_text(encoding='utf-8')
          state = Path('champions/team_state.py').read_text(encoding='utf-8')
          assert 'not str(item).startswith("Mega ")' in roster
          assert 'on_change=on_item_change' in app
          assert 'item_options = list(mega_items) + list(species_items) + list(standard_items)' in app
          assert 'def on_item_change(slot_idx):' in state
          print('Base-form Mega selector checks passed.')
          PY

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py champions/roster_data.py champions/team_state.py
          if git diff --cached --quiet; then
            echo "No application changes were necessary."
          else
            git commit -m "Use base forms for Mega selection and promotion"
            git push
          fi
