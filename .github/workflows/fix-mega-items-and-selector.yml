name: Fix Mega item promotion and item selector

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  migrate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install project test dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          else
            python -m pip install streamlit pytest
          fi
          python -m pip install pytest

      - name: Apply item selector and Mega promotion fix
        run: python tools/fix_mega_items_and_selector.py

      - name: Validate from repository root
        working-directory: .
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m py_compile app.py champions/team_state.py champions/item_data.py champions/team_recommendations.py
          pytest -q tests/test_item_data.py tests/test_item_selector_wiring.py

      - name: Commit application changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py champions/team_state.py champions/item_data.py champions/team_recommendations.py
          if git diff --cached --quiet; then
            echo "No application changes were necessary."
          else
            git commit -m "Fix Mega item promotion and selector behaviour"
            git push
          fi

      - name: Remove completed migration workflow
        if: success()
        run: |
          git fetch origin main
          git pull --ff-only origin main
          if [ -f .github/workflows/fix-mega-items-and-selector.yml ]; then
            git rm .github/workflows/fix-mega-items-and-selector.yml
            git commit -m "Remove completed Mega item selector migration"
            git push
          else
            echo "Migration workflow already removed."
          fi
