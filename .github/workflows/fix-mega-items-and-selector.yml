name: Fix Mega item selector and Mega promotion

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Apply migration
        run: python tools/fix_item_selector_and_mega_promotion.py

      - name: Validate migration
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m py_compile app.py champions/team_state.py champions/item_data.py champions/team_recommendations.py
          python -m pytest -q tests/test_item_data.py tests/test_item_selector_wiring.py tests/test_team_analyzer.py

      - name: Commit application changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py champions/team_state.py tools/fix_item_selector_and_mega_promotion.py tests/test_item_selector_wiring.py .github/workflows/fix-mega-items-and-selector.yml
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Fix item selector categories and Mega promotion"
            git push
          fi

      - name: Remove one-time workflow
        if: success()
        run: |
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          if [ -f .github/workflows/fix-mega-items-and-selector.yml ]; then
            git rm .github/workflows/fix-mega-items-and-selector.yml
            git commit -m "Remove completed item selector migration"
            git push
          fi
