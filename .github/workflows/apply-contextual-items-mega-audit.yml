name: Apply contextual items and Mega roster audit

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-contextual-items-mega-audit.yml'

jobs:
  migrate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply migration
        run: |
          python - <<'PY'
          from pathlib import Path

          item_path = Path('champions/item_data.py')
          text = item_path.read_text()

          if 'POKEMON_SPECIFIC_ITEMS' not in text:
              marker = '\n\n_ITEM_ALIASES = {'
              insert = '''\n\n# Items that are meaningfully associated with one species/form.  These are\n# surfaced separately in the UI, but remain legal only when appropriate.\nPOKEMON_SPECIFIC_ITEMS = {\n    "Pikachu": ("Light Ball",),\n}\n\n\ndef _base_species_for_mega(species: str) -> str:\n    value = str(species or "").strip()\n    if value.startswith("Mega "):\n        value = value[5:]\n        # Mega Raichu X/Y and Mega Charizard X/Y share their base species.\n        value = value.rsplit(" ", 1)[0] if value.endswith((" X", " Y")) else value\n    return value\n\n\ndef get_contextual_item_groups(species: str):\n    """Return (mega_items, species_items, standard_items) for one species."""\n    species = str(species or "").strip()\n    base = _base_species_for_mega(species)\n\n    mega_items = []\n    for mega_name, stone in get_mega_stone_map().items():\n        if _base_species_for_mega(mega_name).casefold() == base.casefold():\n            mega_items.append(stone)\n\n    species_items = list(POKEMON_SPECIFIC_ITEMS.get(base, ()))\n    mega_items = sorted(set(mega_items), key=str.casefold)\n    species_items = sorted(set(species_items), key=str.casefold)\n    special = set(mega_items) | set(species_items)\n    standard_items = [\n        item for item in CHAMPIONS_STANDARD_HELD_ITEMS\n        if item not in special\n    ]\n    return mega_items, species_items, standard_items\n'''
              if marker not in text:
                  raise RuntimeError('item_data insertion marker not found')
              text = text.replace(marker, insert + marker, 1)

          if 'get_contextual_item_groups' not in text.split('__all__', 1)[-1]:
              text = text.replace('    "is_champions_item",\n]', '    "is_champions_item",\n    "POKEMON_SPECIFIC_ITEMS",\n    "get_contextual_item_groups",\n]')
          item_path.write_text(text)

          # Add Mega Abomasnow to the Champions Mega registry if it is absent.
          const_path = Path('champions/constants.py')
          const = const_path.read_text()
          if '"Mega Abomasnow"' not in const:
              marker = 'CUSTOM_MEGAS_DATA = {\n'
              entry = '    "Mega Abomasnow": {"ability": "Snow Warning", "hp": 90, "atk": 132, "def": 105, "spa": 132, "spd": 105, "spd_stat": 30},\n'
              if marker not in const:
                  raise RuntimeError('CUSTOM_MEGAS_DATA marker not found')
              const = const.replace(marker, marker + entry, 1)
              const_path.write_text(const)

          # Add the canonical Mega Abomasnow stone mapping.
          item_text = item_path.read_text()
          if '"Mega Abomasnow": "Abomasite"' not in item_text:
              marker = '    "Mega Venusaur": "Venusaurite",\n'
              if marker not in item_text:
                  raise RuntimeError('Mega stone override marker not found')
              item_text = item_text.replace(marker, marker + '    "Mega Abomasnow": "Abomasite",\n', 1)
              item_path.write_text(item_text)

          # Wire the app selector to contextual groups while preserving the
          # existing Mega-form locking behaviour used by imported Mega forms.
          app_path = Path('app.py')
          app = app_path.read_text()
          old_import = 'from champions.item_data import CHAMPIONS_HELD_ITEMS, MEGA_STONE_MAP'
          new_import = 'from champions.item_data import (\n    CHAMPIONS_HELD_ITEMS,\n    MEGA_STONE_MAP,\n    get_contextual_item_groups,\n)'
          if old_import in app:
              app = app.replace(old_import, new_import, 1)

          old_block = '''            else:\n                item_opts = CHAMPIONS_HELD_ITEMS\n                current_item = slot.get("item", item_opts[0])\n                if current_item not in item_opts:\n                    current_item = item_opts[0]\n                slot["item"] = strlit.selectbox("Held Item", options=item_opts, index=item_opts.index(current_item), key=f"item_{i}")'''
          new_block = '''            else:\n                mega_items, species_items, standard_items = get_contextual_item_groups(slot_name)\n                item_options = []\n                item_labels = {}\n\n                if mega_items:\n                    item_options.append("── ⭐ Mega Evolution ──")\n                    item_options.extend(mega_items)\n                    for item in mega_items:\n                        item_labels[item] = item\n\n                if species_items:\n                    item_options.append("── ⭐ Pokémon-specific ──")\n                    item_options.extend(species_items)\n                    for item in species_items:\n                        item_labels[item] = item\n\n                item_options.append("── General Held Items ──")\n                item_options.extend(standard_items)\n\n                current_item = slot.get("item", "")\n                selectable = [x for x in item_options if not x.startswith("── ")]\n                if current_item not in selectable:\n                    current_item = selectable[0] if selectable else ""\n\n                def _format_item_option(item):\n                    return item if not item.startswith("── ") else item\n\n                selected_item = strlit.selectbox(\n                    "Held Item",\n                    options=item_options,\n                    index=item_options.index(current_item) if current_item in item_options else (\n                        next((idx for idx, value in enumerate(item_options) if not value.startswith("── ")), 0)\n                    ),\n                    key=f"item_{i}",\n                    format_func=_format_item_option,\n                )\n                if selected_item.startswith("── "):\n                    # Streamlit selectboxes cannot make a true non-selectable\n                    # category row, so immediately keep the previous/current\n                    # legal item if a heading is selected.\n                    selected_item = current_item\n                slot["item"] = selected_item'''
          if old_block not in app:
              raise RuntimeError('held-item selector block not found')
          app = app.replace(old_block, new_block, 1)
          app_path.write_text(app)
          PY

      - name: Validate
        run: |
          python -m py_compile app.py champions/item_data.py champions/constants.py
          python - <<'PY'
          from champions.item_data import get_contextual_item_groups
          mega, specific, standard = get_contextual_item_groups('Tyranitar')
          assert 'Tyranitarite' in mega
          assert 'Charizardite X' not in mega
          assert 'Charizardite Y' not in mega
          mega, specific, standard = get_contextual_item_groups('Pikachu')
          assert 'Light Ball' in specific
          assert 'Tyranitarite' not in standard
          print('Contextual item selector validation passed')
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py champions/item_data.py champions/constants.py
          if git diff --cached --quiet; then
            echo "No migration changes required."
            exit 0
          fi
          git commit -m "Add contextual held items and Mega Abomasnow"
          git push

      - name: Disable migration workflow
        if: success()
        run: |
          git rm .github/workflows/apply-contextual-items-mega-audit.yml
          git commit -m "Remove one-time contextual item migration"
          git push
