name: Team Analyzer tests

on:
  push:
    branches: [main]
    paths:
      - "champions/team_analyzer.py"
      - "champions/team_analyzer_ui.py"
      - "champions/team_io.py"
      - "tests/test_team_analyzer.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install pytest streamlit requests

      - name: Run Team Analyzer tests
        run: python -m pytest tests/test_team_analyzer.py -v
