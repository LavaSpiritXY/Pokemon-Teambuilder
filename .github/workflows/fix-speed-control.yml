name: Fix Speed Control Analyzer Labels

on:
  push:
    branches: [main]

permissions:
  contents: write

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'Fix speed control analyzer labels') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch speed control data
        working-directory: ${{ github.workspace }}
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('champions/team_analyzer.py')
          text = path.read_text(encoding='utf-8')

          old = '''_SPEED_CONTROL = {
              "tailwind": "Tailwind",
              "trick room": "Trick Room",
              "icy wind": "Icy Wind",
              "electroweb": "Electroweb",
              "pollen puff": "Pollen Puff",
              "mud shot": "Speed reduction",
              "string shot": "Speed reduction",
              "quash": "Quash",
              "bulldoze": "Speed reduction",
              "electro drift": "Offensive pressure",
          }'''

          new = '''_SPEED_CONTROL = {
              "tailwind": "Tailwind",
              "trick room": "Trick Room",
              "icy wind": "Icy Wind",
              "electroweb": "Electroweb",
              "mud shot": "Mud Shot",
              "string shot": "String Shot",
              "quash": "Quash",
              "bulldoze": "Bulldoze",
          }'''

          if old not in text:
              raise SystemExit('Expected _SPEED_CONTROL block not found; refusing to modify the file.')

          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify analyzer
        working-directory: ${{ github.workspace }}
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_team_analyzer.py

      - name: Commit fix and remove temporary workflow
        working-directory: ${{ github.workspace }}
        run: |
          rm -f .github/workflows/fix-speed-control.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add champions/team_analyzer.py .github/workflows/fix-speed-control.yml
          git diff --cached --quiet || git commit -m "Fix speed control analyzer labels"
          git push
