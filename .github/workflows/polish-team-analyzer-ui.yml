name: Polish Team Analyzer UI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/polish-team-analyzer-ui.yml"
      - "tools/rebuild_team_analyzer_ui.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install pytest streamlit requests

      - name: Rebuild analyzer presentation
        run: python tools/rebuild_team_analyzer_ui.py

      - name: Validate
        run: |
          python -m pytest tests/test_team_analyzer.py -v
          python -m py_compile champions/team_analyzer_ui.py tools/rebuild_team_analyzer_ui.py

      - name: Commit validated UI rebuild
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add champions/team_analyzer_ui.py tools/rebuild_team_analyzer_ui.py .github/workflows/polish-team-analyzer-ui.yml
          git diff --cached --quiet && { echo 'No changes made'; exit 0; }
          git commit -m "Rebuild Team Analyzer presentation layout"
          git push origin HEAD:main
