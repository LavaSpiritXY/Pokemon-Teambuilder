name: Auto extract move data

on:
  push:
    branches:
      - champions-tournament-data
    paths:
      - tools/auto_extract_move_data.py

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run extraction
        run: python tools/auto_extract_move_data.py

      - name: Verify refactor
        run: |
          python -m py_compile app.py champions/move_data.py
          python - <<'PY'
          import ast
          from pathlib import Path
          app = ast.parse(Path('app.py').read_text(encoding='utf-8'))
          names = {n.name for n in app.body if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef))}
          forbidden = {
              'fetch_master_move_dictionary',
              'get_champions_species_key',
              'get_move_api_slug',
              'get_hardcoded_move_type',
              'fetch_move_type',
              'display_name_for_move',
          }
          assert not (names & forbidden), names & forbidden
          print('Extraction source check passed')
          PY

      - name: Commit refactor and remove temporary automation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py champions/move_data.py
          git rm tools/auto_extract_move_data.py .github/workflows/auto-extract-move-data.yml
          git commit -m "Update 27: extract move data helpers"
          git push
