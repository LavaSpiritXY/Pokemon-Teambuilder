name: Team Analyzer and Item Regression

on:
  push:
    branches: [main]
    paths:
      - 'app.py'
      - 'champions/**'
      - 'tests/test_item_data.py'
      - 'tests/test_item_selector_wiring.py'
      - 'tests/test_team_analyzer.py'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Compile application modules
        run: |
          python -m py_compile app.py champions/team_state.py champions/item_data.py champions/team_recommendations.py

      - name: Run item and team analyzer regression tests
        run: |
          python -m pytest -q tests/test_item_data.py tests/test_item_selector_wiring.py tests/test_team_analyzer.py
