name: Phase 3 automated refactor

on:
  push:
    branches: [champions-tournament-data]

permissions:
  contents: write

jobs:
  refactor:
    if: ${{ !contains(github.event.head_commit.message, 'Phase 3 extracted') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: champions-tournament-data
          fetch-depth: 0

      - name: Run Phase 3 extraction
        run: python tools/phase3_extract_checks.py

      - name: Compile refactored modules
        run: python -m py_compile app.py champions/meta_engine.py champions/meta_utils.py champions/meta_viability.py

      - name: Validate extracted function import
        run: python -c "from champions.meta_engine import get_meta_relevant_checks; print('Phase 3 import OK')"

      - name: Validate old function is gone from app.py
        run: python -c "from pathlib import Path; s=Path('app.py').read_text(encoding='utf-8'); assert 'def get_meta_relevant_checks(' not in s; assert 'get_meta_relevant_checks,' in s; print('Phase 3 source wiring OK')"

      - name: Remove temporary refactor files and commit
        run: |
          rm -f tools/phase3_extract_checks.py .github/workflows/phase3-refactor.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py champions/meta_engine.py tools/phase3_extract_checks.py .github/workflows/phase3-refactor.yml
          git commit -m "Phase 3 extracted: meta checks engine"
          git push origin HEAD:champions-tournament-data
