name: Finalize Team Analyzer Field UI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/finalize-team-analyzer-field-ui.yml"
      - "tools/finalize_team_analyzer_field_ui.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install pytest streamlit requests

      - name: Apply final analyzer field changes
        run: python tools/finalize_team_analyzer_field_ui.py

      - name: Validate
        run: |
          python -m pytest tests/test_team_analyzer.py -v
          python -m py_compile champions/team_analyzer.py champions/team_analyzer_ui.py tools/finalize_team_analyzer_field_ui.py

      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add champions/team_analyzer.py champions/team_analyzer_ui.py tools/finalize_team_analyzer_field_ui.py .github/workflows/finalize-team-analyzer-field-ui.yml
          git diff --cached --quiet && { echo 'No changes'; exit 0; }
          git commit -m "Remove duplicate coverage and label field sources"
          git push origin HEAD:main
