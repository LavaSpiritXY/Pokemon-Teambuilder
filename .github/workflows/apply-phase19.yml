name: Apply Phase 19 fixes

on:
  push:
    branches: [champions-tournament-data]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Phase 19 applied') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: champions-tournament-data
          fetch-depth: 0

      - name: Detect Phase 19 state
        id: phase19
        shell: bash
        run: |
          if grep -q "def render_dynamic_stat_controls(" champions_phase18_6_ui.py \
             && grep -q "def render_dynamic_stat_graph(" champions_phase18_6_ui.py \
             && grep -q "from champions_phase18_6_ui import render_dynamic_stat_controls, render_dynamic_stat_graph" app.py \
             && grep -q "def _tournament_index(" champions_phase18_5.py \
             && grep -q "fallback_rows" champions_phase18_4.py; then
            echo "applied=true" >> "$GITHUB_OUTPUT"
            echo "Phase 19 changes are already present; patch scripts will be skipped."
          else
            echo "applied=false" >> "$GITHUB_OUTPUT"
            echo "Phase 19 changes are incomplete; patch scripts will run."
          fi

      - name: Apply Phase 19 hotfix
        if: steps.phase19.outputs.applied != 'true'
        run: python apply_phase19_hotfix.py

      - name: Apply Phase 19 UI and meta fixes
        if: steps.phase19.outputs.applied != 'true'
        run: python apply_phase19_ui_and_meta_fix.py

      - name: Run automated move-data extraction
        if: ${{ hashFiles('tools/auto_extract_move_data.py') != '' }}
        run: python tools/auto_extract_move_data.py

      - name: Compile changed Python modules
        run: |
          python -m py_compile app.py champions_phase18_4.py champions_phase18_5.py champions_phase18_6_ui.py
          if [ -f champions/move_data.py ]; then python -m py_compile champions/move_data.py; fi

      - name: Commit Phase 19 and refactor changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py champions_phase18_4.py champions_phase18_5.py champions_phase18_6_ui.py apply_phase19_ui_and_meta_fix.py apply_phase19_hotfix.py champions/move_data.py
          if [ -f tools/auto_extract_move_data.py ]; then
            git rm tools/auto_extract_move_data.py
          fi
          if [ -f .github/workflows/auto-extract-move-data.yml ]; then
            git rm .github/workflows/auto-extract-move-data.yml
          fi
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Update 27: extract move data helpers"
          git push origin HEAD:champions-tournament-data
