name: Remove legacy Team Evaluator UI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/remove-legacy-team-evaluator.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Remove legacy evaluator UI
        shell: python
        run: |
          from pathlib import Path

          path = Path("app.py")
          text = path.read_text(encoding="utf-8")

          text = text.replace(
              "from champions.meta_engine import (\n    MonMetaProfile,\n    TeamEvaluator,\n    slot_to_mon_meta_profile,\n)\n\n",
              "",
              1,
          )

          legacy_start = '    strlit.divider()\n\n    if not active_slots:'
          start = text.find(legacy_start)
          if start == -1:
              raise SystemExit("Legacy evaluator removal anchor not found")

          text = text[:start].rstrip() + "\n"
          path.write_text(text, encoding="utf-8")

      - name: Validate app
        run: |
          python -m py_compile app.py champions/team_analyzer.py champions/team_analyzer_ui.py

      - name: Commit migration and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py .github/workflows/remove-legacy-team-evaluator.yml
          git diff --cached --quiet && { echo 'No migration changes found'; exit 0; }
          git commit -m "Make Team Analyzer the sole Team Overview evaluator"
          git push origin HEAD:main
