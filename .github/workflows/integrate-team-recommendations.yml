name: Integrate Team Recommendations

on:
  push:
    branches: [main]
    paths:
      - "tools/wire_team_recommendations.py"
      - "champions/team_recommendations.py"
      - "champions/team_recommendations_ui.py"
      - "tests/test_team_recommendations.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install pytest streamlit requests

      - name: Wire recommendation UI
        run: python tools/wire_team_recommendations.py

      - name: Validate recommendation feature
        run: |
          python -m pytest tests/test_team_recommendations.py tests/test_team_analyzer.py -v
          python -m py_compile champions/team_recommendations.py champions/team_recommendations_ui.py champions/team_analyzer_ui.py tools/wire_team_recommendations.py

      - name: Commit validated integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add champions/team_analyzer_ui.py champions/team_recommendations.py champions/team_recommendations_ui.py tests/test_team_recommendations.py tools/wire_team_recommendations.py .github/workflows/integrate-team-recommendations.yml
          git diff --cached --quiet && { echo 'No changes made'; exit 0; }
          git commit -m "Add explainable team addition recommendations"
          git push origin HEAD:main
